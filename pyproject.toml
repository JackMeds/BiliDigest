[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bilidigest"
version = "0.4.1"
description = "Agent-ready Bilibili collection tools with JSON CLI and authenticated HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "JackMeds", email = "jackmeds@users.noreply.github.com"}
]
dependencies = [
    "qrcode[pil]>=7.4.0",
    "requests>=2.31.0",
    "filelock>=3.13.0"
]

[project.scripts]
bili = "tools.agent.cli:main"
bilidigest = "tools.bilidigest:main"

[project.optional-dependencies]
qwen = ["mlx-audio==0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'"]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
llm = ["openai>=1.0.0", "python-dotenv>=1.0.0", "httpx>=0.27"]
browser = ["yt-dlp>=2024.0.0"]
legacy = ["yt-dlp>=2024.0.0", "faster-whisper>=1.0.0", "openai>=1.0.0", "python-dotenv>=1.0.0", "transformers>=4.38.0", "torch>=2.0.0", "torchaudio>=2.0.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.6", "google-generativeai>=0.4.0"]
test = ["pytest>=8", "httpx>=0.27", "fastapi>=0.115,<1", "pydantic>=2,<3", "openai>=1.0.0", "python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]
